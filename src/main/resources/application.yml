spring:
  application:
    name: crud-example
  datasource:
    # Con `./mvnw spring-boot:run` estos valores los reemplaza el contenedor de compose.yaml.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crud}
    username: ${DB_USERNAME:crud}
    password: ${DB_PASSWORD:crud}
  jpa:
    hibernate:
      # El esquema lo gestiona Flyway; Hibernate solo verifica que coincida con las entidades.
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

app:
  security:
    jwt:
      # Clave HMAC en Base64 (minimo 32 bytes). Genera una con: openssl rand -base64 32
      # Si se deja vacia se genera una aleatoria al arrancar (los tokens se invalidan al reiniciar).
      secret: ${JWT_SECRET:}
      expiration: ${JWT_EXPIRATION:1h}
      issuer: crud-example
    admin:
      # Si ADMIN_PASSWORD esta definida, se crea este administrador al arrancar (si no existe).
      email: ${ADMIN_EMAIL:admin@example.com}
      password: ${ADMIN_PASSWORD:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
